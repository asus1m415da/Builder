name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
      URL:
        description: Repository URL
        default: 'https://github.com/asus1m415da/Hestia_kernel'
        required: true
      SETUP_KSU:
        description: Setup KernelSU Next
        default: true
        required: false
        type: boolean
      KSU_REPO:
        description: KernelSU Next repository link
        default: 'KernelSU-Next/KernelSU-Next'
        required: false
      KSU_BRANCH:
        description: KernelSU Next branch
        default: 'dev'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        path: rootdir
        show-progress: false
        fetch-depth: 1
        
    - name: Prepare dependencies
      run: |
        sudo apt update -y
        sudo apt install rsync bc cpio flex bison aptitude aria2 git python-is-python3 tar perl wget curl lz4 -y
        sudo aptitude install libssl-dev -y
        
    - name: Clone Kernel Source
      run: git clone --depth=1 --single-branch -b ${{ inputs.BRANCH }} ${{ inputs.URL }} kernel_root
      working-directory: rootdir

    - name: Fetch toolchains
      run: |
        cd kernel_root
        # We divided it into 2 parts, because of Github Release limitations.
        aria2c https://github.com/rsuntkOrgs/android_kernel_samsung_a05m-6.6/releases/download/v1.0/xaa
        aria2c https://github.com/rsuntkOrgs/android_kernel_samsung_a05m-6.6/releases/download/v1.0/xab
        echo "INFO: Appending files and extracting ..."
        cat xaa xab > toolchains.tar.gz && tar -xf toolchains.tar.gz && rm toolchains.tar.gz xaa xab
        [ ! -f $(pwd)/xaa ] && echo "INFO: Extraction operation is completed." || exit 1
      working-directory: rootdir

    - name: Prepare timezone fix
      run: |
        sudo rm /etc/localtime
        sudo ln -s /usr/share/zoneinfo/Asia/Manila /etc/localtime

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Setup KernelSU Next
      if: inputs.SETUP_KSU == true
      run: |
        cd kernel_root
        rm -f kernel-6.6/android/abi_gki_protected_exports_* || echo "[-] No gki protected exports!"
        
        # Clonamos la versión específica v3.1.0
        git clone --single-branch -b v3.1.0 https://github.com/${{ inputs.KSU_REPO }}.git KernelSU
        
        # HACK DE IDENTIDAD: Forzamos la versión en el código fuente antes de compilar
        echo "[+] Aplicando identidad Inti-Kernel v3.1.0"
        sed -i 's/v0.0.1/v3.1.0/g' $(pwd)/KernelSU/kernel/Kbuild
        sed -i 's/fallback: 1/fallback: 33024/g' $(pwd)/KernelSU/kernel/Kbuild
        
        # Creamos el enlace simbólico hacia el árbol del kernel
        GKI_ROOT=$(pwd)
        ln -sf $(pwd)/KernelSU/kernel $GKI_ROOT/kernel-6.6/drivers/kernelsu
        
        # Registro en Makefile y Kconfig
        DRIVER_MAKEFILE=$GKI_ROOT/kernel-6.6/drivers/Makefile
        DRIVER_KCONFIG=$GKI_ROOT/kernel-6.6/drivers/Kconfig
        grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE"
        grep -q "kernelsu" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG"
      working-directory: rootdir

    - name: Build kernel
      id: buildKernel
      run: |
        cd kernel_root
        
        # ELIMINAR MARCA DE AGUA: Definimos tu firma personalizada
        export KBUILD_BUILD_USER=Eduardo
        export KBUILD_BUILD_HOST=Inti-Kernel
        export KBUILD_BUILD_VERSION=1
        export LOCALVERSION_AUTO=n
        
        # grep linux version
        kernelVersion=$(cd kernel-6.6 && make kernelversion && cd ..)
        [ -f $(pwd)/build_kernel.sh ] && bash build_kernel.sh || exit 1
        
        # Localización del binario
        IMAGE_PATH=$(find out -type f -name "Image.gz" | grep "mgk_64_k66_kernel_aarch64.user" | head -n 1)
        [ -z "$IMAGE_PATH" ] && exit 1
        
        cd out && find . -type f -name "Image.gz" && cd ..
        gitsha1=$(git rev-parse --short HEAD)
        
        # Nombramos los archivos con Inti-Kernel
        buildDetails="Inti-Kernel-${kernelVersion}-A065X_${gitsha1}-$(date +'%Y%m%d%H%M%S')"
        echo "buildDetails=$buildDetails" >> $GITHUB_OUTPUT
        
        cd .. && cp kernel_root/out/target/product/a06/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/Image.gz external/anykernel3
      working-directory: rootdir

    - name: List trees
      run: |
        cd kernel_root/out/target/product/a06/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/
        ls -la
        find . -type f -name "Image.gz" || echo "Image.gz not found!"
      working-directory: rootdir

    - name: Upload AnyKernel3
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-${{ steps.buildKernel.outputs.buildDetails }}
        path: rootdir/external/anykernel3/*
        compression-level: 9

    - name: Upload Image.gz
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: Image_GZ-${{ steps.buildKernel.outputs.buildDetails }}
        path: rootdir/kernel_root/out/target/product/a06/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/Image.gz
        compression-level: 9

    - name: Upload LKM
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: LKM-${{ steps.buildKernel.outputs.buildDetails }}
        path: rootdir/kernel_root/out/target/product/a06/obj/KLEAF_OBJ/dist/kernel_device_modules-6.6/mgk_64_k66_kernel_aarch64.user/drivers/*
        compression-level: 9
